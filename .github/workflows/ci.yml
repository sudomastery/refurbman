name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  probe:
    name: Probe engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      # Scoped to the probe crate on purpose: the desktop app is in this
      # workspace too, and it needs GUI libraries this job has no reason to
      # install. The app has its own job below.
      - run: cargo clippy -p refurbman-probe --all-targets -- -D warnings
      - run: cargo test -p refurbman-probe
      # Windows correctness cannot be checked on the development machine, so the
      # engine is run for real here and asked to produce a report.
      - name: Run the probe
        run: cargo run -p refurbman-probe --bin refurbman-probe -- --json
      - name: Export an HTML report
        run: cargo run -p refurbman-probe --bin refurbman-probe -- --html report.html
      - name: Uploaded report must be self-contained
        shell: bash
        run: |
          test -s report.html
          # An external reference would break the report offline, which is
          # exactly where it gets read.
          if grep -qE 'src=|https?://' report.html; then
            echo "::error::the report pulled in something external"; exit 1
          fi

  shell:
    name: Shell script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: bash -n scripts/refurbman.sh
      - name: ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          shellcheck -S warning scripts/refurbman.sh
      - name: Run unprivileged
        run: ./scripts/refurbman.sh --no-color
      - name: Run privileged
        run: sudo ./scripts/refurbman.sh --no-color
      - name: JSON output must parse
        run: ./scripts/refurbman.sh --json | python3 -m json.tool > /dev/null
      - name: HTML export
        run: |
          ./scripts/refurbman.sh --html report.html
          test -s report.html
          grep -q '</html>' report.html
      # The scripts must stand alone, so each carries its own copy of the
      # stylesheet. This makes that copy mechanical rather than manual: if it
      # has drifted from assets/report.css, the build says so.
      - name: Embedded stylesheets are in step with assets/report.css
        run: python3 scripts/sync-report-css.py --check

  powershell:
    name: PowerShell script
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        shell: pwsh
        run: |
          $errs = $null; $tokens = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/scripts/RefurbMan.ps1", [ref]$tokens, [ref]$errs)
          if ($errs) { $errs | ForEach-Object { Write-Host $_ }; exit 1 }
          Write-Host 'Syntax OK'
      - name: Tests
        shell: pwsh
        run: ./tests/RefurbMan.Tests.ps1
      # The runner is a real Windows machine, so the script is exercised against
      # actual firmware tables rather than only against synthetic ones.
      - name: Run for real
        shell: pwsh
        run: ./scripts/RefurbMan.ps1 -NoColor
      - name: JSON output must parse
        shell: pwsh
        run: ./scripts/RefurbMan.ps1 -Json | ConvertFrom-Json | Out-Null
      - name: HTML export
        shell: pwsh
        run: |
          ./scripts/RefurbMan.ps1 -Html report.html
          if (-not (Test-Path report.html)) { throw 'no report written' }
          if ((Get-Content report.html -Raw) -notmatch '</html>') { throw 'report is truncated' }

  secrets:
    name: No hardware serials in fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Test fixtures are the natural place for a real drive or board serial to
      # leak into a public repository, so the build fails rather than let one
      # through. Fixtures must be fabricated, and fabricated ones say EXAMPLE.
      - name: Scan fixtures
        run: |
          if grep -rInE '"serial_number"[[:space:]]*:[[:space:]]*"(?!EXAMPLE)' \
               --include='*.json' --include='*.rs' crates/ tests/ 2>/dev/null \
             | grep -v 'EXAMPLE' | grep -v 'fabricated'; then
            echo "::error::A fixture appears to contain a real serial number."
            exit 1
          fi
          echo "No real serials found."

  frontend:
    name: Interface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # TypeScript runs strict with noUncheckedIndexedAccess, so a missing
      # fact key is a compile error rather than an undefined at runtime.
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npx vite build

  app:
    name: Desktop app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            librsvg2-dev libayatana-appindicator3-dev libdbus-1-dev \
            libxdo-dev libssl-dev build-essential pkg-config

      # The Windows bundle carries its own smartctl, so it has to be fetched
      # and checksum-verified before the app is compiled.
      - name: Vendor smartmontools
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./scripts/vendor-smartmontools.ps1

      - run: npm ci
      - run: npx vite build
      - name: Check the app
        run: cargo clippy -p refurbman-app --all-targets -- -D warnings
